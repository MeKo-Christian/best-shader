name: test-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v3

      # The runner links GLFW (cgo), so type checking needs its headers.
      - name: Install GLFW build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Check tidy
        run: just check-tidy

      - name: Build and vet
        run: just check-build

      - name: Run linter
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          args: --config ./.golangci.toml --timeout 5m
